<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codie</title>
<link rel="stylesheet" href="/shell/codie.css">
</head>
<body>
<header class="cx-top">
  <a href="/" class="cx-book-title" id="cx-book-title">codie</a>
  <span class="cx-conn" id="cx-conn" data-state="connecting" title="Connection to the codie server">connecting</span>
  <button type="button" class="cx-btn cx-btn-quiet" id="cx-toggle-side" aria-controls="cx-side" aria-expanded="false">Ask codie</button>
</header>

<div class="cx-layout">
  <main class="cx-main">
    <div class="cx-banner" id="cx-banner" hidden></div>
    <article class="cx-content" id="cx-content" aria-live="polite"></article>
    <div class="cx-finish" id="cx-finish" hidden>
      <button type="button" class="cx-btn" id="cx-finish-btn">I've finished this chapter</button>
      <p class="cx-hint" id="cx-finish-note"></p>
    </div>
    <nav class="cx-pager" id="cx-pager"></nav>
  </main>

  <aside class="cx-side" id="cx-side" aria-label="Talk to codie">
    <div class="cx-side-head">
      <h2>Ask codie</h2>
      <button type="button" class="cx-close" id="cx-close-side" aria-label="Close sidebar" title="Close (Esc)">×</button>
    </div>
    <div class="cx-side-scroll">
      <div class="cx-threads" id="cx-threads"></div>
      <p class="cx-empty" id="cx-threads-empty"></p>
    </div>
    <form class="cx-compose" id="cx-compose">
      <div class="cx-attach" id="cx-compose-attach" hidden>
        <span class="cx-attach-quote" id="cx-compose-quote"></span>
        <button type="button" class="cx-close" id="cx-compose-unquote" aria-label="Remove passage" title="Remove passage (Esc)">×</button>
      </div>
      <textarea id="cx-compose-text" rows="2" aria-label="Message to codie"></textarea>
      <div class="cx-row">
        <button type="submit" class="cx-btn">Send</button>
        <span class="cx-hint">⌘↵ to send</span>
      </div>
    </form>
  </aside>
</div>

<button type="button" class="cx-ask-sel" id="cx-ask-sel" hidden>Ask about this</button>
<div class="cx-toast" id="cx-toast" role="status" hidden></div>
<script type="module" src="/shell/codie.js"></script>
</body>
</html>
